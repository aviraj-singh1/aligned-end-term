[project]
name = "gst-reconciliation-tool"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.5,<4",
    "xlrd>=2.0.1,<3",
    "rapidfuzz>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.24,<0.1.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "argon2-cffi>=23.1,<26",
    "python-dotenv>=1.0,<2",
    "email-validator>=2.1,<3",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]
